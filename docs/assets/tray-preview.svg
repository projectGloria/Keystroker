<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="taskbarBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <linearGradient id="menuBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202431" />
      <stop offset="100%" stop-color="#181b24" />
    </linearGradient>

    <linearGradient id="trayGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="menuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="680" height="320" rx="14" fill="#0d0f15" stroke="#232734" stroke-width="1.2" />

  <!-- Title & Description -->
  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">WINDOWS SYSTEM TRAY INTEGRATION</text>
  <text x="32" y="55" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Runs silently in background with instant tray toggle and quick controls</text>

  <!-- Windows Taskbar Mockup -->
  <g transform="translate(32, 236)">
    <rect width="616" height="52" rx="8" fill="url(#taskbarBg)" stroke="#262c3c" stroke-width="1" />
    
    <!-- Left Taskbar area -->
    <text x="24" y="31" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Windows 11 Taskbar</text>

    <!-- Right Notification Area -->
    <g transform="translate(380, 11)">
      <!-- WiFi Icon -->
      <path d="M 12 18 A 6 6 0 0 1 18 24 M 8 15 A 12 12 0 0 1 22 24 M 4 12 A 18 18 0 0 1 26 24" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" />
      
      <!-- Audio Icon -->
      <path d="M 45 14 L 51 14 L 57 9 L 57 23 L 51 18 L 45 18 Z" fill="#94a3b8" />
      <path d="M 61 11 A 6 6 0 0 1 61 21" fill="none" stroke="#94a3b8" stroke-width="1.6" />

      <!-- Keystroker Tray Icon with Active Highlight -->
      <g transform="translate(85, -2)">
        <rect width="34" height="34" rx="6" fill="#2d3345" stroke="#4f46e5" stroke-width="1.5" />
        <rect x="7" y="7" width="20" height="20" rx="4" fill="url(#trayGlow)" />
        <text x="17" y="21.5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">K</text>
      </g>

      <!-- Clock -->
      <text x="145" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">8:30 AM</text>
      <text x="145" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">10/26/2026</text>
    </g>
  </g>

  <!-- Right-Click Context Menu -->
  <g transform="translate(425, 82)" filter="url(#menuShadow)">
    <rect width="210" height="136" rx="10" fill="url(#menuBg)" stroke="#32384a" stroke-width="1" />

    <!-- Item 1: Open Keystroker -->
    <g transform="translate(10, 10)">
      <rect width="190" height="30" rx="6" fill="#2b3144" />
      <text x="12" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open Keystroker</text>
      <text x="170" y="20" fill="#a5b4fc" font-size="12">↗</text>
    </g>

    <!-- Item 2: Pause Sounds -->
    <g transform="translate(10, 46)">
      <text x="12" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Pause Sounds</text>
    </g>

    <!-- Separator -->
    <line x1="10" y1="84" x2="200" y2="84" stroke="#2d3345" stroke-width="1" />

    <!-- Item 3: Exit -->
    <g transform="translate(10, 92)">
      <text x="12" y="20" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Exit Keystroker</text>
    </g>
  </g>

  <!-- Tray Tooltip Box -->
  <g transform="translate(80, 140)">
    <rect width="280" height="60" rx="8" fill="#1c202c" stroke="#32384a" stroke-width="1" />
    <circle cx="28" cy="30" r="14" fill="#4f46e5" fill-opacity="0.2" />
    <text x="28" y="35" fill="#818cf8" font-size="14" text-anchor="middle">💡</text>
    <text x="54" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Left-Click: Instant Toggle</text>
    <text x="54" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Click icon to show or hide the HUD</text>
  </g>
</svg>
