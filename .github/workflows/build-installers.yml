name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer (x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Determine release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            npm version "$version" --no-git-tag-version --allow-same-version
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application and Windows NSIS installer
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never

      - name: Collect installers into installers/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          $installer = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -eq ".exe" } |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "No .exe installer found in release/"
            exit 1
          }
          $targetName = "Keystroker-$($env:APP_VERSION)-windows-x64.exe"
          Copy-Item -Path $installer.FullName -Destination (Join-Path "installers" $targetName)
          Get-ChildItem installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
