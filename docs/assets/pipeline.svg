<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222f" />
      <stop offset="100%" stop-color="#151821" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="880" height="260" rx="14" fill="url(#bgBox)" stroke="#232734" stroke-width="1.2" />

  <!-- Title -->
  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="-0.2">REAL-TIME LOW-LATENCY AUDIO PIPELINE</text>
  <text x="32" y="55" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Asynchronous OS hook event processing with pre-decoded hardware buffer playback</text>

  <!-- Step 1: Hardware Input -->
  <g transform="translate(32, 75)">
    <rect width="180" height="150" rx="10" fill="url(#cardGrad)" stroke="#2a3042" stroke-width="1" />
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#accentPurple)" />
    <text x="23" y="36" font-size="16">⌨️</text>
    <text x="56" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Hardware Input</text>
    <text x="56" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Physical Devices</text>

    <g transform="translate(14, 62)">
      <rect width="152" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Keys: Space, Enter, Backspace</text>
    </g>
    <g transform="translate(14, 92)">
      <rect width="152" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Mouse: Left, Right, Middle</text>
    </g>
    <g transform="translate(14, 122)">
      <rect width="152" height="18" rx="4" fill="#1e1b4b" />
      <text x="10" y="13" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Global OS-wide capture</text>
    </g>
  </g>

  <!-- Connector 1 -->
  <g transform="translate(216, 140)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="26,0 20,-4 20,4" fill="#4f46e5" />
  </g>

  <!-- Step 2: Native Hook & Main Process -->
  <g transform="translate(244, 75)">
    <rect width="185" height="150" rx="10" fill="url(#cardGrad)" stroke="#2a3042" stroke-width="1" />
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#accentCyan)" />
    <text x="22" y="36" font-size="16">⚡</text>
    <text x="56" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">uiohook-napi</text>
    <text x="56" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">C++ Native Thread</text>

    <g transform="translate(14, 62)">
      <rect width="157" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Low-level Windows Hook</text>
    </g>
    <g transform="translate(14, 92)">
      <rect width="157" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">25ms Anti-Machinegun Filter</text>
    </g>
    <g transform="translate(14, 122)">
      <rect width="157" height="18" rx="4" fill="#083344" />
      <text x="10" y="13" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Instant IPC Event Broadcast</text>
    </g>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(433, 140)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="26,0 20,-4 20,4" fill="#06b6d4" />
  </g>

  <!-- Step 3: Web Audio Engine -->
  <g transform="translate(461, 75)">
    <rect width="185" height="150" rx="10" fill="url(#cardGrad)" stroke="#2a3042" stroke-width="1" />
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#accentAmber)" />
    <text x="23" y="36" font-size="16">🎛️</text>
    <text x="56" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Sound Engine</text>
    <text x="56" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Chromium Web Audio</text>

    <g transform="translate(14, 62)">
      <rect width="157" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Pre-Decoded AudioBuffers</text>
    </g>
    <g transform="translate(14, 92)">
      <rect width="157" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Micro Pitch Jitter (±2%)</text>
    </g>
    <g transform="translate(14, 122)">
      <rect width="157" height="18" rx="4" fill="#451a03" />
      <text x="10" y="13" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">latencyHint: 'interactive'</text>
    </g>
  </g>

  <!-- Connector 3 -->
  <g transform="translate(650, 140)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />
    <polygon points="26,0 20,-4 20,4" fill="#f59e0b" />
  </g>

  <!-- Step 4: Speakers & Output -->
  <g transform="translate(678, 75)">
    <rect width="170" height="150" rx="10" fill="url(#cardGrad)" stroke="#2a3042" stroke-width="1" />
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#accentEmerald)" />
    <text x="23" y="36" font-size="16">🔊</text>
    <text x="56" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Acoustic Out</text>
    <text x="56" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Speakers / Headset</text>

    <g transform="translate(14, 62)">
      <rect width="142" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Polyphonic Mixing</text>
    </g>
    <g transform="translate(14, 92)">
      <rect width="142" height="24" rx="4" fill="#10121a" />
      <text x="10" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Linear Gain Staging</text>
    </g>
    <g transform="translate(14, 122)">
      <rect width="142" height="18" rx="4" fill="#064e3b" />
      <text x="10" y="13" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Zero Audio Latency</text>
    </g>
  </g>
</svg>
